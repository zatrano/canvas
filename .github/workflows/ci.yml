name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Unit tests
        run: go test ./... -count=1
      - name: Race
        run: go test ./... -race -count=1

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Performance gates
        run: go test -run 'Gate' -v -count=1

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Microbenchmarks
        run: >
          go test . -run=^$
          -bench='Benchmark(CanvasRTTo|CanvasTyped|QuickTemplate|HTMLTemplateDataGet)$'
          -benchmem -count=1 -benchtime=500ms
