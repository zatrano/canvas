name: Performance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Performance gates vs quicktemplate
        run: go test -C bench -run '^TestGate' -count=1 -timeout 8m -v
      - name: Microbenchmarks
        run: >
          go test -C bench -run=^$
          -bench='Benchmark(CanvasTyped|QuickTemplate)$'
          -benchmem -count=1 -benchtime=500ms
        # Root module also has non-QT benches:
      - name: Root microbenchmarks
        run: >
          go test . -run=^$
          -bench='Benchmark(CanvasRTTo|HTMLTemplateDataGet)$'
          -benchmem -count=1 -benchtime=500ms
